name: Release

# The only workflow that publishes a fork release. Push a vX.Y.Z-loft.N tag:
# the job builds and attests tailscaled, uploads it to a draft release, and
# publishes the release last. Do not create the release in the UI first; a
# published release fails the run, because its assets must not change after
# publication.
on:
  push:
    tags:
      - 'v*-loft.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-binary:
    name: Publish Tailscale binary
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write # Needed to create the draft release and upload the binaries
      id-token: write # Needed for the attestation signing certificate
      attestations: write # Needed to store the attestations

    steps:
      - name: Validate release tag name
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-loft\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_VERSION' does not match the vX.Y.Z-loft.N scheme"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -euo pipefail
          echo "Building tailscaled binaries for ${RELEASE_VERSION}"
          # Strip the leading "v" so stamped versions match Tailscale's convention
          # (e.g. "v1.96.4-loft.15" -> "1.96.4-loft.15").
          VERSION_SHORT="${RELEASE_VERSION#v}"
          GIT_COMMIT=$(git rev-parse HEAD)
          GIT_COMMIT_SHORT="${GIT_COMMIT:0:9}"
          VERSION_LONG="${VERSION_SHORT}-t${GIT_COMMIT_SHORT}"
          LDFLAGS="-s -w -X tailscale.com/version.longStamp=${VERSION_LONG} -X tailscale.com/version.shortStamp=${VERSION_SHORT} -X tailscale.com/version.gitCommitStamp=${GIT_COMMIT}"
          CGO_ENABLED=0 GOARCH=amd64 GOOS=linux go build -trimpath -ldflags="$LDFLAGS" -o tailscaled-linux-amd64 ./cmd/tailscaled
          CGO_ENABLED=0 GOARCH=arm64 GOOS=linux go build -trimpath -ldflags="$LDFLAGS" -o tailscaled-linux-arm64 ./cmd/tailscaled

          go version -m tailscaled-linux-amd64 | tee tailscaled-linux-amd64.buildinfo
          go version -m tailscaled-linux-arm64 | tee tailscaled-linux-arm64.buildinfo
          grep -q 'CGO_ENABLED=0' tailscaled-linux-amd64.buildinfo
          grep -q 'CGO_ENABLED=0' tailscaled-linux-arm64.buildinfo

      - name: Attest binaries
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: tailscaled-linux-*64

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $RELEASE_VERSION is already published and its assets must not change. Cut a new tag instead."
              exit 1
            fi
            echo "Reusing draft release $RELEASE_VERSION"
            exit 0
          fi
          gh release create "$RELEASE_VERSION" --draft --verify-tag --title "$RELEASE_VERSION" --notes ""

      - name: Upload binaries to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_VERSION" tailscaled-linux-amd64 tailscaled-linux-arm64 --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_VERSION" --draft=false
