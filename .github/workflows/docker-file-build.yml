name: "Dockerfile build"
on: 
  push:
    branches:
    - main
  pull_request:
    branches:
      - "*"
      # Fork release branches use fork-release-validation.yaml.
      - '!release-v*-loft.*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: "Build Docker image"
      run: docker build .
